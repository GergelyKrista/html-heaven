<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OW2 Counter Picker</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --border: #1e1e2a;
      --text: #e8e8f0;
      --text-dim: #6b6b80;
      --accent: #f97316;
      --accent-glow: #f9731640;
      --tank: #2563eb;
      --tank-bg: #2563eb18;
      --dps: #dc2626;
      --dps-bg: #dc262618;
      --support: #16a34a;
      --support-bg: #16a34a18;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    header { text-align: center; margin-bottom: 2.5rem; }

    h1 {
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #fff, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle { color: var(--text-dim); margin-top: 0.4rem; font-size: 0.95rem; }

    /* Role filter tabs */
    .role-filters {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .role-tab {
      padding: 0.45rem 1rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-dim);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .role-tab:hover { border-color: #444; color: var(--text); }
    .role-tab.active { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }
    .role-tab[data-role="Tank"].active { border-color: var(--tank); color: var(--tank); background: var(--tank-bg); }
    .role-tab[data-role="DPS"].active { border-color: var(--dps); color: var(--dps); background: var(--dps-bg); }
    .role-tab[data-role="Support"].active { border-color: var(--support); color: var(--support); background: var(--support-bg); }

    .section-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      margin-bottom: 0.75rem;
    }

    /* Hero grid */
    .hero-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 0.5rem;
      margin-bottom: 2rem;
    }

    .hero-btn {
      padding: 0.6rem 0.4rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
      line-height: 1.2;
    }

    .hero-btn:hover { border-color: #555; transform: translateY(-1px); }

    .hero-btn.selected {
      border-color: var(--accent);
      background: var(--accent-glow);
      color: #fff;
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .hero-btn .role-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      margin-right: 4px;
      vertical-align: middle;
    }

    .hero-btn .role-dot.Tank { background: var(--tank); }
    .hero-btn .role-dot.DPS { background: var(--dps); }
    .hero-btn .role-dot.Support { background: var(--support); }
    .hero-btn.hidden { display: none; }

    /* Selected display */
    .selected-display {
      text-align: center;
      margin-bottom: 1rem;
      min-height: 2rem;
    }

    .selected-display span { font-size: 1rem; color: var(--text-dim); }
    .selected-display .enemy-name { color: var(--accent); font-weight: 800; font-size: 1.2rem; }

    /* Role lock */
    .role-lock {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .role-lock-label { font-size: 0.85rem; color: var(--text-dim); font-weight: 600; }

    .role-lock-btn {
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-dim);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .role-lock-btn:hover { border-color: #444; color: var(--text); }
    .role-lock-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }

    /* Counter button */
    .counter-btn-wrap { text-align: center; margin-bottom: 2.5rem; }

    .counter-btn {
      padding: 0.85rem 2.5rem;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, var(--accent), #ea580c);
      color: #fff;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
    }

    .counter-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px var(--accent-glow);
    }

    .counter-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Results */
    .results { display: none; }
    .results.visible { display: block; animation: fadeUp 0.4s ease; }

    .roast-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.5rem;
      font-size: 1.05rem;
      line-height: 1.5;
      font-style: italic;
      color: var(--text-dim);
      border-left: 3px solid var(--accent);
    }

    .counter-cards { display: grid; gap: 1rem; }

    .counter-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      display: flex;
      gap: 1rem;
      align-items: flex-start;
      animation: fadeUp 0.4s ease backwards;
    }

    .counter-card:nth-child(1) { animation-delay: 0.1s; }
    .counter-card:nth-child(2) { animation-delay: 0.2s; }
    .counter-card:nth-child(3) { animation-delay: 0.3s; }

    .counter-card .rank {
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--accent);
      line-height: 1;
      min-width: 2rem;
    }

    .counter-card .info { flex: 1; }
    .counter-card .hero-name { font-size: 1.15rem; font-weight: 800; margin-bottom: 0.15rem; }

    .counter-card .role-badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      margin-bottom: 0.5rem;
    }

    .role-badge.Tank { background: var(--tank-bg); color: var(--tank); border: 1px solid var(--tank); }
    .role-badge.DPS { background: var(--dps-bg); color: var(--dps); border: 1px solid var(--dps); }
    .role-badge.Support { background: var(--support-bg); color: var(--support); border: 1px solid var(--support); }

    .counter-card .reason { color: var(--text-dim); font-size: 0.9rem; line-height: 1.4; }

    .no-counters {
      text-align: center;
      color: var(--text-dim);
      padding: 2rem;
      font-style: italic;
    }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid #fff4;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 0.5rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    footer {
      text-align: center;
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 0.8rem;
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.8rem; }
      .hero-grid { grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); }
      .counter-card { flex-direction: column; gap: 0.5rem; }
    }
  </style>
</head>

    // ═══════════════════════════════════════════════════
    //  APP STATE
    // ═══════════════════════════════════════════════════
    let selectedHero = null;
    let roleFilter = "All";
    let roleLock = "Any";

    const grid = document.getElementById("heroGrid");
    const counterBtn = document.getElementById("counterBtn");
    const selectedDisplay = document.getElementById("selectedDisplay");
    const resultsEl = document.getElementById("results");
    const roastEl = document.getElementById("roast");
    const cardsEl = document.getElementById("counterCards");

    // ═══════════════════════════════════════════════════
    //  BUILD HERO GRID
    // ═══════════════════════════════════════════════════
    function buildGrid() {
      grid.innerHTML = "";
      HEROES.forEach(function(h) {
        var btn = document.createElement("button");
        btn.className = "hero-btn";
        btn.dataset.hero = h.name;
        btn.dataset.role = h.role;
        btn.innerHTML = '<span class="role-dot ' + h.role + '"></span>' + h.name;
        btn.addEventListener("click", function() { selectHero(h.name); });
        grid.appendChild(btn);
      });
      applyRoleFilter();
    }

    function selectHero(name) {
      selectedHero = name;
      document.querySelectorAll(".hero-btn").forEach(function(b) {
        b.classList.toggle("selected", b.dataset.hero === name);
      });
      selectedDisplay.innerHTML = '<span>Countering <span class="enemy-name">' + esc(name) + '</span></span>';
      counterBtn.disabled = false;
      resultsEl.classList.remove("visible");
    }

    function applyRoleFilter() {
      document.querySelectorAll(".hero-btn").forEach(function(b) {
        b.classList.toggle("hidden", roleFilter !== "All" && b.dataset.role !== roleFilter);
      });
    }

    // ═══════════════════════════════════════════════════
    //  ROLE FILTER TABS (hero grid)
    // ═══════════════════════════════════════════════════
    document.querySelectorAll(".role-tab").forEach(function(tab) {
      tab.addEventListener("click", function() {
        document.querySelectorAll(".role-tab").forEach(function(t) { t.classList.remove("active"); });
        tab.classList.add("active");
        roleFilter = tab.dataset.role;
        applyRoleFilter();
      });
    });

    // ═══════════════════════════════════════════════════
    //  ROLE LOCK BUTTONS (counter results)
    // ═══════════════════════════════════════════════════
    document.querySelectorAll(".role-lock-btn").forEach(function(btn) {
      btn.addEventListener("click", function() {
        document.querySelectorAll(".role-lock-btn").forEach(function(b) { b.classList.remove("active"); });
        btn.classList.add("active");
        roleLock = btn.dataset.lock;
      });
    });

    // ═══════════════════════════════════════════════════
    //  COUNTER BUTTON
    // ═══════════════════════════════════════════════════
    counterBtn.addEventListener("click", function() {
      if (!selectedHero || !COUNTERS[selectedHero]) return;

      var data = COUNTERS[selectedHero];
      var counters = data.counters;

      // Filter by role lock
      if (roleLock !== "Any") {
        counters = counters.filter(function(c) { return c.role === roleLock; });
      }

      // Take top 3
      counters = counters.slice(0, 3);

      if (counters.length === 0) {
        roastEl.textContent = "No " + roleLock + " counters found. Try a different role.";
        cardsEl.innerHTML = "";
        resultsEl.classList.add("visible");
        return;
      }

      renderResults({ roast: data.roast, counters: counters });
    });

    // ═══════════════════════════════════════════════════
    //  RENDER
    // ═══════════════════════════════════════════════════
    function renderResults(data) {
      roastEl.textContent = '"' + data.roast + '"';
      cardsEl.innerHTML = data.counters.map(function(c, i) {
        return '<div class="counter-card">' +
          '<div class="rank">#' + (i + 1) + '</div>' +
          '<div class="info">' +
            '<div class="hero-name">' + esc(c.hero) + '</div>' +
            '<span class="role-badge ' + c.role + '">' + c.role + '</span>' +
            '<div class="reason">' + esc(c.reason) + '</div>' +
          '</div>' +
        '</div>';
      }).join("");
      resultsEl.classList.add("visible");
      resultsEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function esc(s) {
      var d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    buildGrid();
  </script>
</body>
