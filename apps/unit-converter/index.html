<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit Converter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f0f1a;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
  }
  h1 {
    font-size: 1.6rem;
    margin-bottom: 0.5rem;
    background: linear-gradient(135deg, #22d3ee, #3b82f6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle { color: #888; margin-bottom: 2rem; font-size: 0.9rem; }
  .categories {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 2rem;
  }
  .categories button {
    padding: 8px 18px;
    border-radius: 20px;
    border: 1px solid #333;
    background: #1a1a2e;
    color: #aaa;
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.2s;
  }
  .categories button.active {
    background: linear-gradient(135deg, #22d3ee, #3b82f6);
    color: white;
    border-color: transparent;
  }
  .converter {
    background: #1a1a2e;
    border-radius: 16px;
    padding: 2rem;
    width: 100%;
    max-width: 420px;
  }
  .field { margin-bottom: 1.5rem; }
  .field label {
    display: block;
    font-size: 0.85rem;
    color: #888;
    margin-bottom: 0.5rem;
  }
  .field input, .field select {
    width: 100%;
    padding: 12px 16px;
    background: #0f0f1a;
    border: 1px solid #333;
    border-radius: 10px;
    color: #e0e0e0;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .field input:focus, .field select:focus { border-color: #3b82f6; }
  .swap-btn {
    display: block;
    margin: 0 auto 1.5rem;
    background: #2a2a3e;
    border: 1px solid #444;
    color: #aaa;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1.2rem;
    transition: all 0.2s;
  }
  .swap-btn:hover { background: #3b82f6; color: white; border-color: #3b82f6; }
  .result {
    text-align: center;
    padding: 1rem;
    background: #0f0f1a;
    border-radius: 10px;
    font-size: 1.4rem;
    font-weight: 600;
    color: #22d3ee;
    min-height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
</style>
</head>
<body>
<h1>Unit Converter</h1>
<p class="subtitle">Quick conversions between common units</p>
<div class="categories" id="cats"></div>
<div class="converter">
  <div class="field">
    <label>From</label>
    <select id="fromUnit"></select>
  </div>
  <div class="field">
    <label>Value</label>
    <input type="number" id="input" value="1" step="any">
  </div>
  <button class="swap-btn" onclick="swap()">⇅</button>
  <div class="field">
    <label>To</label>
    <select id="toUnit"></select>
  </div>
  <div class="result" id="result"></div>
</div>
<script>
const units = {
  Length: {
    Meters: 1, Kilometers: 1000, Centimeters: 0.01, Millimeters: 0.001,
    Miles: 1609.344, Yards: 0.9144, Feet: 0.3048, Inches: 0.0254
  },
  Weight: {
    Kilograms: 1, Grams: 0.001, Milligrams: 0.000001,
    Pounds: 0.453592, Ounces: 0.0283495, Tons: 1000
  },
  Temperature: { Celsius: 'C', Fahrenheit: 'F', Kelvin: 'K' },
  Speed: {
    'km/h': 1, 'm/s': 3.6, 'mph': 1.60934, 'knots': 1.852
  },
  Data: {
    Bytes: 1, Kilobytes: 1024, Megabytes: 1048576,
    Gigabytes: 1073741824, Terabytes: 1099511627776
  }
};

let currentCat = 'Length';

function init() {
  const cats = document.getElementById('cats');
  cats.innerHTML = '';
  Object.keys(units).forEach(cat => {
    const btn = document.createElement('button');
    btn.textContent = cat;
    btn.className = cat === currentCat ? 'active' : '';
    btn.onclick = () => { currentCat = cat; init(); };
    cats.appendChild(btn);
  });
  const unitNames = Object.keys(units[currentCat]);
  const fromSel = document.getElementById('fromUnit');
  const toSel = document.getElementById('toUnit');
  fromSel.innerHTML = unitNames.map((u, i) => `<option${i===0?' selected':''}>${u}</option>`).join('');
  toSel.innerHTML = unitNames.map((u, i) => `<option${i===1?' selected':''}>${u}</option>`).join('');
  convert();
}

function convert() {
  const val = parseFloat(document.getElementById('input').value) || 0;
  const from = document.getElementById('fromUnit').value;
  const to = document.getElementById('toUnit').value;
  let result;
  if (currentCat === 'Temperature') {
    let celsius;
    if (from === 'Celsius') celsius = val;
    else if (from === 'Fahrenheit') celsius = (val - 32) * 5/9;
    else celsius = val - 273.15;
    if (to === 'Celsius') result = celsius;
    else if (to === 'Fahrenheit') result = celsius * 9/5 + 32;
    else result = celsius + 273.15;
  } else {
    const u = units[currentCat];
    result = val * u[from] / u[to];
  }
  const display = Number.isInteger(result) ? result : result.toFixed(6).replace(/\.?0+$/, '');
  document.getElementById('result').textContent = `${display} ${to}`;
}

function swap() {
  const f = document.getElementById('fromUnit');
  const t = document.getElementById('toUnit');
  [f.value, t.value] = [t.value, f.value];
  convert();
}

document.getElementById('input').addEventListener('input', convert);
document.getElementById('fromUnit').addEventListener('change', convert);
document.getElementById('toUnit').addEventListener('change', convert);
init();
</script>
</body>
</html>
