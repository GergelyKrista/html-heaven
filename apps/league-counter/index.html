<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoL Counter Picks</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --panel-bg: #1e2328;
            --text-main: #f0e6d2;
            --text-muted: #a09b8c;
            --accent-gold: #c8aa6e;
            --accent-red: #e84057;
            --accent-green: #0397ab;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            background-color: #111;
            padding: 20px 0;
            text-align: center;
            border-bottom: 2px solid var(--accent-gold);
            margin-bottom: 30px;
        }

        h1 {
            margin: 0;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .container {
            max-width: 1000px;
            width: 90%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .search-box {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            background-color: var(--panel-bg);
            border: 1px solid var(--accent-gold);
            color: var(--text-main);
            border-radius: 5px;
            outline: none;
            box-sizing: border-box;
        }

        .search-box:focus {
            box-shadow: 0 0 10px rgba(200, 170, 110, 0.5);
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }

        .champion-list {
            background-color: var(--panel-bg);
            border: 1px solid #333;
            border-radius: 5px;
            max-height: 600px;
            overflow-y: auto;
            padding: 10px;
        }

        .champion-item {
            padding: 12px;
            cursor: pointer;
            border-bottom: 1px solid #333;
            transition: background 0.2s;
            font-weight: bold;
        }

        .champion-item:hover {
            background-color: #2a3137;
            color: var(--accent-gold);
        }

        .details-panel {
            background-color: var(--panel-bg);
            border: 1px solid #333;
            border-radius: 5px;
            padding: 30px;
            display: none; /* Hidden until a champ is selected */
        }

        .champ-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
        }

        .champ-header h2 {
            margin: 0;
            font-size: 32px;
            color: var(--accent-gold);
        }

        .counters-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .counter-box {
            background-color: #111;
            padding: 15px;
            border-radius: 5px;
        }

        .counter-box h3 {
            margin-top: 0;
            border-bottom: 2px solid;
            padding-bottom: 10px;
        }

        .weak-against h3 {
            color: var(--accent-red);
            border-color: var(--accent-red);
        }

        .strong-against h3 {
            color: var(--accent-green);
            border-color: var(--accent-green);
        }

        .counter-tag {
            display: inline-block;
            background-color: #2a3137;
            padding: 8px 12px;
            margin: 5px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }
        
        .counter-tag:hover {
            background-color: var(--accent-gold);
            color: #000;
        }

        .placeholder {
            text-align: center;
            color: var(--text-muted);
            padding: 50px;
            background-color: var(--panel-bg);
            border: 1px solid #333;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <header>
        <h1>LoL Counter Picks</h1>
    </header>

    <div class="container">
        <input type="text" id="searchInput" class="search-box" placeholder="Search for a champion (e.g., Ahri, Yasuo, Darius)...">

        <div class="layout">
            <div class="champion-list" id="championList">
                </div>

            <div id="placeholder" class="placeholder">
                <h2>Select a champion to view counters</h2>
            </div>

            <div class="details-panel" id="detailsPanel">
                <div class="champ-header">
                    <h2 id="selectedChampName">Champion Name</h2>
                </div>

                <div class="counters-grid">
                    <div class="counter-box weak-against">
                        <h3>Weak Against (Counters)</h3>
                        <div id="weakList"></div>
                    </div>
                    <div class="counter-box strong-against">
                        <h3>Strong Against</h3>
                        <div id="strongList"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Mock Database of Champions and their counters
        // In a real production app, you would fetch this from an API or a larger JSON file.
        const championData = {
            "Ahri": {
                weakAgainst: ["Yasuo", "Zed", "Fizz", "Katarina"],
                strongAgainst: ["Veigar", "Ryze", "Lux", "Karthus"]
            },
            "Yasuo": {
                weakAgainst: ["Annie", "Malzahar", "Pantheon", "Renekton"],
                strongAgainst: ["Ahri", "Lux", "Gnar", "Twisted Fate"]
            },
            "Zed": {
                weakAgainst: ["Lulu", "Lissandra", "Malzahar", "Kayle"],
                strongAgainst: ["Ahri", "Kassadin", "Veigar", "Orianna"]
            },
            "Darius": {
                weakAgainst: ["Teemo", "Quinn", "Vayne", "Jayce"],
                strongAgainst: ["Garen", "Sion", "Nasus", "Yasuo"]
            },
            "Garen": {
                weakAgainst: ["Darius", "Teemo", "Camille", "Vayne"],
                strongAgainst: ["Riven", "Renekton", "Jax", "Irelia"]
            },
            "Teemo": {
                weakAgainst: ["Pantheon", "Olaf", "Rumble", "Cassiopeia"],
                strongAgainst: ["Garen", "Darius", "Tryndamere", "Vayne"]
            },
            "Jinx": {
                weakAgainst: ["Draven", "Lucian", "Tristana", "Twitch"],
                strongAgainst: ["Aphelios", "Zeri", "Sivir", "Caitlyn"]
            },
            "Thresh": {
                weakAgainst: ["Morgana", "Zyra", "Brand", "Leona"],
                strongAgainst: ["Nautilus", "Blitzcrank", "Pyke", "Alistar"]
            }
        };

        const championListEl = document.getElementById('championList');
        const searchInput = document.getElementById('searchInput');
        const detailsPanel = document.getElementById('detailsPanel');
        const placeholder = document.getElementById('placeholder');
        const selectedChampName = document.getElementById('selectedChampName');
        const weakList = document.getElementById('weakList');
        const strongList = document.getElementById('strongList');

        // Extract champion names and sort them alphabetically
        const champions = Object.keys(championData).sort();

        // Render the list of champions
        function renderList(filter = '') {
            championListEl.innerHTML = '';
            const filteredChamps = champions.filter(c => c.toLowerCase().includes(filter.toLowerCase()));
            
            if (filteredChamps.length === 0) {
                championListEl.innerHTML = '<div style="padding: 10px; color: #a09b8c;">No champions found.</div>';
                return;
            }

            filteredChamps.forEach(champ => {
                const div = document.createElement('div');
                div.className = 'champion-item';
                div.textContent = champ;
                div.onclick = () => selectChampion(champ);
                championListEl.appendChild(div);
            });
        }

        // Handle selecting a champion
        function selectChampion(champName) {
            const data = championData[champName];
            
            // Hide placeholder, show details
            placeholder.style.display = 'none';
            detailsPanel.style.display = 'block';
            
            // Populate data
            selectedChampName.textContent = champName;
            
            weakList.innerHTML = '';
            data.weakAgainst.forEach(counter => {
                const span = document.createElement('span');
                span.className = 'counter-tag';
                span.textContent = counter;
                // Allow clicking a counter to navigate to them (if they exist in DB)
                span.onclick = () => {
                    if(championData[counter]) {
                        selectChampion(counter);
                    } else {
                        alert(counter + " data not yet added to the demo database!");
                    }
                };
                weakList.appendChild(span);
            });

            strongList.innerHTML = '';
            data.strongAgainst.forEach(counter => {
                const span = document.createElement('span');
                span.className = 'counter-tag';
                span.textContent = counter;
                span.onclick = () => {
                    if(championData[counter]) {
                        selectChampion(counter);
                    } else {
                        alert(counter + " data not yet added to the demo database!");
                    }
                };
                strongList.appendChild(span);
            });
            
            // Scroll to top on mobile
            if (window.innerWidth <= 768) {
                detailsPanel.scrollIntoView({ behavior: 'smooth' });
            }
        }

        // Search event listener
        searchInput.addEventListener('input', (e) => {
            renderList(e.target.value);
        });

        // Initial render
        renderList();
    </script>
</body>
</html>
