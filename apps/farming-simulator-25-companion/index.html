<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FS25 Field Guide</title>
<style>
:root {
    --bg:     #121113;
    --sf:     #1e1d20;
    --sf2:    #28272b;
    --gd:     #3D5C00;
    --gl:     #6BD425;
    --or:     #E8871E;
    --tx:     #FFFFFF;
    --mu:     #8a8a90;
    --dg:     #e05555;
    --bdr:    rgba(255,255,255,.07);
    --szn-wi: #182537;
    --szn-sp: #172b10;
    --szn-su: #272100;
    --szn-au: #271600;
}
body.light {
    --bg:     #f2f1ec;
    --sf:     #ffffff;
    --sf2:    #eae8e1;
    --gd:     #3D5C00;
    --gl:     #3b7a00;
    --or:     #c46a14;
    --tx:     #18171a;
    --mu:     #5c5c63;
    --dg:     #c03535;
    --bdr:    rgba(0,0,0,.09);
    --szn-wi: rgba(80,120,200,.12);
    --szn-sp: rgba(61,92,0,.1);
    --szn-su: rgba(200,160,0,.1);
    --szn-au: rgba(200,90,0,.1);
}

*{margin:0;padding:0;box-sizing:border-box}

body {
    background:var(--bg); color:var(--tx);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    font-size:15px; line-height:1.55;
    transition:background .2s,color .2s;
}

/* ── Header ── */
header {
    background:var(--gd);
    padding:1.05rem 1.6rem;
    display:flex; align-items:center; gap:.7rem;
    border-bottom:2px solid rgba(107,212,37,.25);
}
header h1{font-size:1.3rem;font-weight:700;letter-spacing:-.3px;color:#fff}
header p {color:rgba(255,255,255,.48);font-size:.8rem}
.hdr-right{margin-left:auto;display:flex;gap:.45rem;flex-shrink:0}
.hdr-btn {
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.22);
    color:#fff; border-radius:6px;
    padding:.32rem .75rem;
    font-size:.78rem; font-weight:600;
    cursor:pointer; transition:background .15s;
}
.hdr-btn:hover{background:rgba(255,255,255,.22)}

/* ── Nav ── */
nav {
    background:var(--sf); display:flex;
    overflow-x:auto; border-bottom:1px solid var(--sf2);
    scrollbar-width:none;
}
nav::-webkit-scrollbar{display:none}
nav button {
    background:none; border:none;
    border-bottom:2px solid transparent;
    color:var(--mu); padding:.78rem 1.25rem;
    cursor:pointer; font-size:.875rem;
    white-space:nowrap; transition:color .15s;
}
nav button:hover{color:var(--tx)}
nav button.active{color:var(--gl);border-bottom-color:var(--gl)}

/* ── Layout ── */
main{max-width:1100px;margin:0 auto;padding:1.65rem 1.4rem}
.tab{display:none}
.tab.active{display:block}
h2{font-size:1.1rem;color:var(--gl);margin-bottom:1.15rem;padding-bottom:.43rem;border-bottom:1px solid var(--sf2)}
h3{font-size:.9rem;font-weight:600;color:var(--or);margin-bottom:.48rem}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:1.35rem}
@media(max-width:680px){.two-col{grid-template-columns:1fr}}

/* ── Cards ── */
.card{background:var(--sf);border-radius:7px;padding:.95rem 1.1rem;margin-bottom:.65rem}
.cg{border-left:3px solid var(--gd)}
.co{border-left:3px solid var(--or)}

/* ── Callouts ── */
.tip,.warn{border-radius:5px;padding:.52rem .78rem;font-size:.79rem;margin-top:.55rem;color:var(--mu)}
.tip {background:rgba(107,212,37,.07);border:1px solid rgba(107,212,37,.17)}
.tip  strong{color:var(--gl)}
.warn{background:rgba(232,135,30,.07);border:1px solid rgba(232,135,30,.19)}
.warn strong{color:var(--or)}

/* ── Flowchart ── */
.flow{display:flex;flex-direction:column;align-items:center}
.flow-step {
    width:100%;max-width:545px;
    background:var(--sf);
    border:1.5px solid var(--gd);
    border-radius:7px; padding:.78rem .95rem;
}
.flow-step.cond{border-color:var(--or)}
.flow-step.done{border-color:var(--gl)}

.flow-head{display:flex;align-items:center;gap:.52rem;margin-bottom:.26rem}
.flow-num {
    width:21px;height:21px;border-radius:50%;
    background:rgba(61,92,0,.55);color:var(--gl);
    font-size:.67rem;font-weight:700;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.flow-step.cond .flow-num{background:rgba(232,135,30,.18);color:var(--or)}
.flow-step.done .flow-num{background:rgba(107,212,37,.13);color:var(--gl)}
.flow-title{font-weight:600;font-size:.89rem}
.flow-badge {
    margin-left:auto;flex-shrink:0;
    font-size:.66rem;font-weight:600;
    padding:.11rem .46rem;border-radius:20px;white-space:nowrap;
}
.breg {background:rgba(61,92,0,.5);   color:var(--gl)}
.bcond{background:rgba(232,135,30,.15);color:var(--or)}
.bdlc {background:rgba(232,135,30,.1);border:1px solid rgba(232,135,30,.25);color:var(--or)}

.flow-desc{font-size:.79rem;color:var(--mu);padding-left:1.48rem;margin-bottom:.42rem}
.flow-equip{display:flex;flex-wrap:wrap;gap:.28rem;padding-left:1.48rem}
.eq-chip {
    font-size:.7rem;background:var(--sf2);
    color:var(--mu);border:1px solid var(--bdr);
    border-radius:4px;padding:.11rem .43rem;
}
body.light .eq-chip{color:var(--tx)}

.flow-con{width:1.5px;height:17px;background:rgba(107,212,37,.17);position:relative}
.flow-con::after {
    content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    border-left:4px solid transparent;border-right:4px solid transparent;
    border-top:5px solid rgba(107,212,37,.24);
}
body.light .flow-con{background:rgba(61,92,0,.25)}
body.light .flow-con::after{border-top-color:rgba(61,92,0,.32)}

/* ── Yield rows ── */
.yrow{display:flex;justify-content:space-between;padding:.29rem 0;border-bottom:1px solid var(--sf2);font-size:.83rem}
.yrow:last-child{border:none}
.pos{color:var(--gl)}
.neg{color:var(--dg)}
.neu{color:var(--or)}

/* ── Calendar ── */
.cal-wrap{overflow-x:auto}
.cal-table{width:100%;border-collapse:collapse;min-width:530px;font-size:.78rem}
.cal-table th{padding:.46rem .25rem;text-align:center;color:var(--mu);font-weight:600;background:var(--sf2);font-size:.73rem}
.cal-table th:first-child{text-align:left;padding-left:.82rem;color:var(--tx);min-width:112px}
.cal-table td{padding:.36rem .25rem;text-align:center;border-bottom:1px solid var(--sf2)}
.cal-table td:first-child{text-align:left;padding-left:.82rem;font-weight:500;font-size:.8rem}
.cal-table tr:hover td{background:rgba(128,128,128,.05)}
.szn-th{font-size:.68rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:.26rem .25rem}
body.light .szn-th{color:rgba(0,0,0,.45) !important}

.ds{display:block;width:22px;height:14px;border-radius:3px;background:var(--gl);margin:0 auto}
.dh{display:block;width:22px;height:14px;border-radius:3px;background:var(--or);margin:0 auto}
.db{display:block;width:22px;height:14px;border-radius:3px;background:linear-gradient(90deg,var(--gl) 50%,var(--or) 50%);margin:0 auto}

.cal-legend{display:flex;gap:1.05rem;margin-bottom:.8rem;font-size:.78rem}
.cal-legend div{display:flex;align-items:center;gap:.36rem;color:var(--mu)}
.ll{width:13px;height:13px;border-radius:3px}

.cat-row td {
    background:var(--sf2);color:var(--gl);
    font-size:.68rem;font-weight:700;
    text-transform:uppercase;letter-spacing:.06em;
    padding:.35rem .82rem;border-top:2px solid var(--bg);
}

/* ── pH rows ── */
.ph-row{display:flex;align-items:center;padding:.29rem .52rem;border-radius:4px;font-size:.78rem;margin-bottom:2px}
.ph-range{min-width:73px;font-weight:600}
.ph-label{flex:1;color:var(--mu)}
.ph-chip{font-size:.68rem;font-weight:600;padding:.07rem .43rem;border-radius:20px}
.ph-danger{background:rgba(224,85,85,.08)}
.ph-warn  {background:rgba(232,135,30,.08)}
.ph-ok    {background:rgba(107,212,37,.09)}

/* ── PF list items ── */
.pf-item{padding:.36rem 0;border-bottom:1px solid var(--sf2);font-size:.8rem}
.pf-item:last-child{border:none}
.pf-item-t{color:var(--tx);font-weight:600;margin-bottom:.13rem}
.pf-item-d{color:var(--mu)}
</style>
</head>

   CONTROLS
══════════════════════════════════════════════ */
function toggleTheme() {
    theme = theme === 'dark' ? 'light' : 'dark';
    document.body.classList.toggle('light', theme === 'light');
    document.getElementById('themeBtn').innerHTML = theme === 'dark' ? '&#9728;' : '&#9790;';
}

function toggleLang() {
    lang = lang === 'en' ? 'hu' : 'en';
    document.getElementById('langBtn').textContent = lang === 'en' ? 'HU' : 'EN';
    renderAll();
}

function showTab(id, btn) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + id).classList.add('active');
    btn.classList.add('active');
    activeTab = id;
}

/* ══════════════════════════════════════════════
   RENDER: WORKFLOW
══════════════════════════════════════════════ */
function renderWorkflow(w, ui) {
    const flowHTML = w.steps.map((s, i) => `
        <div class="flow-step${s.type ? ' '+s.type : ''}">
            <div class="flow-head">
                <div class="flow-num">${i+1}</div>
                <div class="flow-title">${s.title}</div>
                <span class="flow-badge ${s.badge}">${s.label}</span>
            </div>
            <div class="flow-desc">${s.desc}</div>
            <div class="flow-equip">${s.equip.map(e=>`<span class="eq-chip">${e}</span>`).join('')}</div>
        </div>
        ${i < w.steps.length-1 ? '<div class="flow-con"></div>' : ''}
    `).join('');

    const sb = w.sb;
    const sideHTML = `
        <h3>${sb.plow.title}</h3>
        <div class="card cg">
            <p style="font-size:.84rem;color:var(--mu)">${sb.plow.body}</p>
            <div class="tip"><strong>${ui.tip}:</strong> ${sb.plow.tip}</div>
        </div>
        <h3>${sb.fert.title}</h3>
        <div class="card co">
            <p style="font-size:.84rem;color:var(--mu);margin-bottom:.52rem">${sb.fert.body}</p>
            <div style="font-size:.82rem">
                <div style="padding:.28rem 0;border-bottom:1px solid var(--sf2)"><span style="color:var(--gl)">${sb.fert.s1}</span> ${sb.fert.s1d}</div>
                <div style="padding:.28rem 0"><span style="color:var(--gl)">${sb.fert.s2}</span> ${sb.fert.s2d}</div>
            </div>
        </div>
        <h3>${sb.weed.title}</h3>
        <div class="card cg">
            <p style="font-size:.84rem;color:var(--mu)">${sb.weed.body}</p>
            <div class="warn"><strong>&#9888;</strong> ${sb.weed.warn}</div>
        </div>
        <h3>${sb.yield.title}</h3>
        <div class="card cg">
            ${sb.yield.rows.map(r=>`<div class="yrow"><span>${r.l}</span><span class="${r.c}">${r.v}</span></div>`).join('')}
        </div>
    `;

    document.getElementById('tab-workflow').innerHTML = `
        <h2>${w.heading}</h2>
        <p style="color:var(--mu);font-size:.81rem;margin-bottom:1.05rem">${w.intro}</p>
        <div class="two-col">
            <div><div class="flow">${flowHTML}</div></div>
            <div>${sideHTML}</div>
        </div>
    `;
}

/* ══════════════════════════════════════════════
   RENDER: CALENDAR
══════════════════════════════════════════════ */
function renderCalendar(c) {
    const sznRow = '<th></th>' + c.seasons.map(s=>
        `<th colspan="${s.span}" class="szn-th" style="background:var(--${s.cls});color:rgba(255,255,255,.42)">${s.label}</th>`
    ).join('');

    const monRow = `<th>${c.cropCol}</th>` + c.months.map(m=>`<th>${m}</th>`).join('');

    let bodyRows = '';
    let prevCat = null;
    CROP_DATA.forEach((cd, i) => {
        if (cd.cat !== prevCat) {
            bodyRows += `<tr class="cat-row"><td colspan="13">${c.categories[cd.cat]}</td></tr>`;
            prevCat = cd.cat;
        }
        let row = `<td>${c.crops[i]}</td>`;
        for (let m = 0; m < 12; m++) {
            if (cd.sow[m] && cd.harv[m]) row += `<td><span class="db"></span></td>`;
            else if (cd.sow[m])           row += `<td><span class="ds"></span></td>`;
            else if (cd.harv[m])          row += `<td><span class="dh"></span></td>`;
            else                          row += `<td></td>`;
        }
        bodyRows += `<tr>${row}</tr>`;
    });

    const n = c.notes;
    document.getElementById('tab-calendar').innerHTML = `
        <h2>${c.heading}</h2>
        <p style="color:var(--mu);font-size:.84rem;margin-bottom:.82rem">${c.intro}</p>
        <div class="cal-legend">
            <div><span class="ll" style="background:var(--gl)"></span>${c.legend[0]}</div>
            <div><span class="ll" style="background:var(--or)"></span>${c.legend[1]}</div>
            <div><span class="ll" style="background:linear-gradient(90deg,var(--gl) 50%,var(--or) 50%)"></span>${c.legend[2]}</div>
        </div>
        <div class="cal-wrap">
            <table class="cal-table">
                <thead><tr>${sznRow}</tr><tr>${monRow}</tr></thead>
                <tbody>${bodyRows}</tbody>
            </table>
        </div>
        <div class="two-col" style="margin-top:1.35rem">
            <div>
                <h3>${n.winter.title}</h3>
                <div class="card cg"><p style="font-size:.8rem;color:var(--mu)">${n.winter.body}</p></div>
                <h3>${n.summer.title}</h3>
                <div class="card cg"><p style="font-size:.8rem;color:var(--mu)">${n.summer.body}</p></div>
            </div>
            <div>
                <h3>${n.root.title}</h3>
                <div class="card cg"><p style="font-size:.8rem;color:var(--mu)">${n.root.body}</p></div>
                <h3>${n.perennial.title}</h3>
                <div class="card cg"><p style="font-size:.8rem;color:var(--mu)">${n.perennial.body}</p></div>
            </div>
        </div>
    `;
}

/* ══════════════════════════════════════════════
   RENDER: PRECISION FARMING
══════════════════════════════════════════════ */
function renderPrecision(p, ui) {
    const phRows = p.ph.rows.map(r=>`
        <div class="ph-row ${r.cls}">
            <span class="ph-range">${r.range}</span>
            <span class="ph-label">${r.label}</span>
            <span class="ph-chip" style="${r.cs}">${r.status}</span>
        </div>`).join('');

    const nTiers = p.n.tiers.map(t=>`
        <div class="pf-item">
            <div class="pf-item-t">${t.level}</div>
            <div class="pf-item-d">${t.crops}</div>
        </div>`).join('');

    const sampSteps = p.sampling.steps.map(s=>`<li>${s}</li>`).join('');

    const rotRows = p.rotation.rows.map(r=>`
        <div class="yrow"><span>${r.l}</span><span class="${r.c}">${r.v}</span></div>`).join('');

    const orgItems = p.organic.items.map(i=>`
        <div class="pf-item">
            <div class="pf-item-t">${i.name}</div>
            <div class="pf-item-d">${i.note}</div>
        </div>`).join('');

    document.getElementById('tab-precision').innerHTML = `
        <h2>${p.heading}</h2>
        <p style="color:var(--mu);font-size:.84rem;margin-bottom:1.15rem">${p.intro}</p>
        <div class="two-col">
            <div>
                <h3>${p.ph.title}</h3>
                <div class="card cg">
                    <p style="font-size:.84rem;color:var(--mu);margin-bottom:.78rem">${p.ph.desc}</p>
                    ${phRows}
                    <div class="tip" style="margin-top:.72rem"><strong>${ui.fix}:</strong> ${p.ph.fix}</div>
                </div>
                <h3>${p.n.title}</h3>
                <div class="card co">
                    <p style="font-size:.84rem;color:var(--mu);margin-bottom:.68rem">${p.n.desc}</p>
                    ${nTiers}
                    <div class="warn" style="margin-top:.58rem"><strong>&#9888;</strong> ${p.n.warn}</div>
                    <div class="tip"><strong>${ui.tip}:</strong> ${p.n.tip}</div>
                </div>
            </div>
            <div>
                <h3>${p.sampling.title}</h3>
                <div class="card cg">
                    <ol style="font-size:.84rem;color:var(--mu);padding-left:1.1rem;line-height:2.05">${sampSteps}</ol>
                    <div class="tip"><strong>${ui.tip}:</strong> ${p.sampling.tip}</div>
                </div>
                <h3>${p.om.title}</h3>
                <div class="card cg">
                    <p style="font-size:.84rem;color:var(--mu);margin-bottom:.52rem"><strong style="color:var(--tx)">${p.om.omT}</strong> — ${p.om.omD}</p>
                    <p style="font-size:.84rem;color:var(--mu)"><strong style="color:var(--tx)">${p.om.ecT}</strong> — ${p.om.ecD}</p>
                    <div class="tip"><strong>${ui.tip}:</strong> ${p.om.tip}</div>
                </div>
                <h3>${p.rotation.title}</h3>
                <div class="card cg">
                    <p style="font-size:.84rem;color:var(--mu);margin-bottom:.58rem">${p.rotation.desc}</p>
                    ${rotRows}
                    <div class="tip" style="margin-top:.55rem"><strong>${ui.tip}:</strong> ${p.rotation.tip}</div>
                </div>
                <h3>${p.organic.title}</h3>
                <div class="card cg">
                    <p style="font-size:.84rem;color:var(--mu);margin-bottom:.52rem">${p.organic.desc}</p>
                    ${orgItems}
                </div>
            </div>
        </div>
    `;
}

/* ══════════════════════════════════════════════
   BOOT
══════════════════════════════════════════════ */
function renderAll() {
    const d = T[lang];
    document.getElementById('hTitle').textContent = d.appTitle;
    document.getElementById('hSub').textContent   = d.appSub;
    document.title = d.appTitle;

    const nav = document.getElementById('navBar');
    nav.innerHTML = '';
    d.tabs.forEach((label, i) => {
        const btn = document.createElement('button');
        btn.textContent = label;
        if (d.tabIds[i] === activeTab) btn.classList.add('active');
        btn.onclick = () => showTab(d.tabIds[i], btn);
        nav.appendChild(btn);
    });

    renderWorkflow(d.wf, d.ui);
    renderCalendar(d.cal);
    renderPrecision(d.pf, d.ui);
}

renderAll();
</script>
</body>
</html>
