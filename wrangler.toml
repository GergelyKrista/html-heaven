name = "html-heaven"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "htmlheaven.com", custom_domain = true },
  { pattern = "www.htmlheaven.com", custom_domain = true },
]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"
