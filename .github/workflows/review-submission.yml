name: Auto-review submission

# Runs on any PR that touches apps/ — i.e. new submissions or delete PRs.
# Two jobs in one workflow:
#   1. Static-analyse the submitted HTML, post a review comment, label
#      the PR, and fail CI on critical findings.
#   2. (Same-repo PRs only) headless-render every changed app, save
#      apps/<slug>/thumbnail.png, and push the new files back to the PR
#      branch — so contributors don't have to remember to regenerate
#      thumbnails when they update their HTML.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "apps/**"

permissions:
  contents: write        # for pushing auto-generated thumbnails
  pull-requests: write   # for comment + labels
  issues: write          # labels live on the issue side

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0  # need history to diff against base

      - name: Determine changed HTML files
        id: changed
        run: |
          # Compare against the PR base (usually main). Use -z so we get
          # NUL-terminated records — keeps filenames with spaces, newlines,
          # or shell metacharacters ($, backticks) safe when we pass them
          # to the review script via xargs later. Writing to a file also
          # avoids interpolating untrusted filenames into the workflow
          # shell via expression substitution.
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          git diff --name-only -z --diff-filter=AM \
            "$BASE_SHA" "$HEAD_SHA" \
            -- 'apps/*/*.html' 'apps/*/*.htm' > changed.txt || true
          if [ -s changed.txt ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Changed HTML files:"
          tr '\0' '\n' < changed.txt

      - name: Skip if no HTML changed
        if: steps.changed.outputs.has_changes == 'false'
        run: echo "This PR doesn't add or modify any app HTML files — skipping auto-review."

      - name: Run review script
        id: review
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          # xargs -0 consumes NUL-delimited filenames and passes each as
          # its own argv, so the shell never re-parses the filenames.
          xargs -0 -a changed.txt node scripts/review-submission.mjs > review.json
          echo "Report:"
          cat review.json

      - name: Comment + label on PR
        if: steps.changed.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        with:
          script: |
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync("review.json", "utf-8"));
            const prNumber = Number(process.env.PR_NUMBER);
            const author = process.env.PR_AUTHOR;

            const critical = report.findings.filter((f) => f.severity === "critical");
            const warnings = report.findings.filter((f) => f.severity === "warning");
            const infos    = report.findings.filter((f) => f.severity === "info");

            const verdict = report.overall === "critical" ? "🔴 Needs manual review — critical issues"
                          : report.overall === "suspicious" ? "🟡 Needs manual review — warnings"
                          : "🟢 Looks clean";

            function bullets(arr) {
              return arr.map((f) => {
                const snip = f.snippet ? `\n    \`${f.snippet.replace(/`/g, "\\`")}\`` : "";
                return `- **${f.category}** in \`${f.file}\`: ${f.message}${snip}`;
              }).join("\n");
            }

            let body = `## 🤖 Auto-review\n\n**Verdict:** ${verdict}\n\n`;
            body += `Scanned ${report.filesReviewed.length} HTML file${report.filesReviewed.length === 1 ? "" : "s"}: ${report.filesReviewed.map((f) => `\`${f}\``).join(", ")}\n\n`;
            body += `- ${critical.length} critical · ${warnings.length} warning · ${infos.length} info\n\n`;

            if (critical.length) {
              body += `### 🔴 Critical\n${bullets(critical)}\n\n`;
            }
            if (warnings.length) {
              body += `### 🟡 Warnings\n${bullets(warnings)}\n\n`;
            }
            if (infos.length) {
              body += `<details><summary>ℹ️ Info (${infos.length})</summary>\n\n${bullets(infos)}\n\n</details>\n\n`;
            }

            if (report.overall === "clean") {
              body += `---\nNo issues found. Safe to merge unless you want to eyeball the content.\n`;
            } else {
              body += `---\n**@${author}** — please take a look at the flagged items before merging.\n`;
            }

            const { owner, repo } = context.repo;

            // Find an existing auto-review comment from github-actions[bot]
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: prNumber, per_page: 100,
            });
            const mine = comments.find((c) =>
              c.user?.type === "Bot" && c.body && c.body.startsWith("## 🤖 Auto-review")
            );

            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
            }

            // Manage labels
            const desired = report.overall === "clean" ? "auto-review:clean"
                          : report.overall === "suspicious" ? "auto-review:needs-review"
                          : "auto-review:critical";
            const allLabels = ["auto-review:clean", "auto-review:needs-review", "auto-review:critical"];

            // Ensure labels exist (idempotent)
            const colors = {
              "auto-review:clean": "2ecc71",
              "auto-review:needs-review": "f39c12",
              "auto-review:critical": "e74c3c",
            };
            for (const name of allLabels) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch {
                try {
                  await github.rest.issues.createLabel({
                    owner, repo, name, color: colors[name],
                    description: "Set by the submission auto-reviewer workflow.",
                  });
                } catch {}
              }
            }

            // Remove the labels we don't want, add the one we do
            for (const name of allLabels) {
              if (name === desired) continue;
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: prNumber, name });
              } catch {}
            }
            await github.rest.issues.addLabels({ owner, repo, issue_number: prNumber, labels: [desired] });

      - name: Fail CI on critical
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          VERDICT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('review.json','utf-8')).overall)")
          echo "Verdict: $VERDICT"
          if [ "$VERDICT" = "critical" ]; then
            echo "::error::Submission flagged as critical by auto-review. Admin merge required."
            exit 1
          fi

      # ───────────────────────────────────────────────────────────────
      # Auto-thumbnail steps. Same-repo PRs only — fork PRs get a
      # read-only GITHUB_TOKEN regardless of declared permissions, so
      # we can't push back to their branches.
      # ───────────────────────────────────────────────────────────────

      - name: Set up Node
        if: steps.changed.outputs.has_changes == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies + Chromium
        if: steps.changed.outputs.has_changes == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Generate manifest (copies app HTML into public/ with back badge)
        if: steps.changed.outputs.has_changes == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        run: npm run generate-manifest

      - name: Headless-render each changed app
        if: steps.changed.outputs.has_changes == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          # Static server pointing at public/ — what take-thumbnails.mjs
          # expects (it requests /apps/<slug>/index.html). Python's
          # http.server is preinstalled on the runner; faster than
          # `npx serve` which would download a package first.
          python3 -m http.server 3000 --directory public > /dev/null 2>&1 &
          SERVER_PID=$!

          # Wait up to 30s for the server.
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:3000/; then break; fi
            sleep 1
          done

          # Extract slug names from the NUL-delimited list of changed paths.
          SLUGS=$(tr '\0' '\n' < changed.txt | sed -nE 's|^apps/([^/]+)/.*|\1|p' | sort -u)
          echo "Slugs to shoot: $SLUGS"

          # --force so we always re-capture for any HTML that changed in
          # this PR. The script skips externally-hosted apps automatically.
          for slug in $SLUGS; do
            BASE_URL=http://localhost:3000 \
              node scripts/take-thumbnails.mjs --force "$slug" \
              || echo "::warning::Failed to shoot $slug"
          done

          kill $SERVER_PID 2>/dev/null || true

      - name: Commit + push thumbnails back to the PR branch
        if: steps.changed.outputs.has_changes == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/*/thumbnail.png 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No thumbnail changes to commit."
          else
            git commit -m "🤖 Auto-generate thumbnails for changed apps"
            # We checked out at head.sha (detached). Push that commit
            # onto the PR's branch ref.
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

      - name: Note when fork PR thumbnails are skipped
        if: steps.changed.outputs.has_changes == 'true' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::warning::Fork PR — skipping auto-thumbnail because the workflow's GITHUB_TOKEN is read-only on fork PRs. Admin should run scripts/take-thumbnails.mjs manually before merge."
